<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Gestión de Mascotas</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-primary: #2c302e;
      --accent-color: #2e5a44;
      --border-radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--border-radius);
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 { color: var(--accent-color); margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .toggle-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      color: #6e7571;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2 id="form-title">Iniciar Sesión</h2>
    
    <form id="auth-form">
      <div class="form-group" id="group-name" style="display: none;">
        <label>Nombre</label>
        <input type="text" id="name" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="******">
      </div>
      <button type="submit" id="btn-submit">Ingresar</button>
    </form>

    <div class="toggle-link" id="toggle-btn" onclick="toggleForm()">
      ¿No tenés cuenta? Registrate acá
    </div>
  </div>

  <script>
    let isLogin = true;

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById('form-title').textContent = isLogin ? 'Iniciar Sesión' : 'Crear Cuenta';
      document.getElementById('group-name').style.display = isLogin ? 'none' : 'block';
      document.getElementById('btn-submit').textContent = isLogin ? 'Ingresar' : 'Registrarse';
      document.getElementById('toggle-btn').textContent = isLogin ? '¿No tenés cuenta? Registrate acá' : '¿Ya tenés cuenta? Iniciá sesión';
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;

      const endpoint = isLogin ? '/auth/login' : '/auth/register';
      const bodyData = isLogin ? { email, password } : { name, email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Error al procesar la solicitud');

        if (isLogin) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        } else {
          alert('Cuenta creada exitosamente. Ahora podés iniciar sesión.');
          toggleForm();
        }
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
