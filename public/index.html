<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Mascota</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-primary: #2c302e;
      --text-secondary: #6e7571;
      --accent-color: #2e5a44;
      --accent-hover: #234735;
      --danger-color: #c0392b;
      --border-radius: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: var(--border-radius);
      padding: 30px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .card-header h1 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin: 0 0 10px 0;
    }

    .pet-name {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-color);
      margin: 0 0 20px 0;
    }

    .info-section {
      background-color: #f9f9f8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .info-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .info-content {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .btn-alerta {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(46, 90, 68, 0.2);
      margin-bottom: 12px;
    }

    .btn-alerta:hover {
      background-color: var(--accent-hover);
    }

    .btn-reportar {
      background-color: transparent;
      color: var(--danger-color);
      border: 2px solid var(--danger-color);
      width: 100%;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reportar:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    .btn-alerta:active, .btn-reportar:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Mascota Encontrada</h1>
    </div>

    <!-- Banner para cuando la mascota está perdida -->
    <div id="status-banner"></div>

    <h2 id="pet-name" class="pet-name">Cargando...</h2>

    <div class="info-section">
      <div class="info-label">Información Médica</div>
      <div id="pet-medical" class="info-content">Cargando datos...</div>
    </div>

    <div class="info-section">
      <div class="info-label">Contacto del Dueño</div>
      <div id="pet-phone" class="info-content">Cargando teléfono...</div>
    </div>

    <button id="btn-alerta" class="btn-alerta">AVISAR AL DUEÑO</button>
  </div>

  <!-- Importamos el JS de forma externa con defer para asegurar que el DOM esté listo -->
  <script src="/app.js" defer></script>
</body>
</html>
